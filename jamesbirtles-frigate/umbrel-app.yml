manifestVersion: 1.1
id: jamesbirtles-frigate
folderAccess:
  - id: media-storage
    name: Media Storage
    note: Choose where Frigate stores recordings, snapshots and exports. Move existing media to the new folder before switching.
    mounts:
      - service: web
        targetPath: /media/frigate
        readOnly: false
category: automation
name: Frigate
version: "0.18.1"
icon: https://getumbrel.github.io/umbrel-apps-gallery/frigate/icon.svg
tagline: A complete and local NVR
description: >-
  A complete and local NVR designed for Home Assistant with AI object detection. 
  Uses OpenCV and Tensorflow to perform realtime object detection locally for IP cameras.


  🛠️ SET-UP


  - New installs start without a placeholder camera. Add cameras in Settings → Global configuration → Camera management.

  - On umbrelOS 2.0, choose a host, external-drive, or network-share folder for recordings, snapshots, and exports in Frigate's Umbrel app settings. Move existing media before changing folders.


  - Sign in to Frigate with username `admin` and the "default app password" displayed on Frigate's page in the app store (shown after install). The same default app password is also used as your RTSP password if needed.
releaseNotes: >-
  Frigate 0.18 is a major upgrade. Back up your Frigate config and database before upgrading; Frigate will attempt to migrate existing configs automatically, but some setups may need manual changes.


  - Fixes security issues in camera access checks, request-path auth handling, and malformed webpush subscription startup handling.


  - Improves Intel QSV CPU usage for high-frame-rate cameras, semantic search reindexing, recording stream restart behavior, and ZMQ stability.


  - Includes additional fixes for review filtering, export thumbnail access, GenAI debug thumbnails, camera group permissions, FFmpeg environment variables, and MSE playback buffering.


  Full release notes can be found at https://github.com/blakeblackshear/frigate/releases/tag/v0.18.1
developer: Blake Blackshear
website: https://frigate.video/
repo: https://github.com/blakeblackshear/frigate
support: https://github.com/blakeblackshear/frigate/issues
port: 5004
gallery:
  - https://getumbrel.github.io/umbrel-apps-gallery/frigate/1.jpg
  - https://getumbrel.github.io/umbrel-apps-gallery/frigate/2.jpg
  - https://getumbrel.github.io/umbrel-apps-gallery/frigate/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
dependencies: []
permissions:
  - GPU
submitter: James Birtles
submission: https://github.com/jamesbirtles/umbrel-app-store
